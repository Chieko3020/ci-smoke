name: smoke
on:
  push:
    branches: [main]
concurrency:
  group: cue-selfhosted
  cancel-in-progress: false
jobs:
  probe:
    runs-on: self-hosted
    steps:
      - name: 环境基线（含 concurrency 键是否被接受）
        run: |
          set -euo pipefail
          echo "host=$(hostname)"
          g++-14 --version | head -1
          cmake --version | head -1
          node --version
          echo "concurrency 键被接受：本 job 正常执行"
